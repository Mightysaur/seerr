name: Sync with Upstream and Release

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if already synced'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/seerr-team/seerr.git || true
          git fetch upstream --tags

      - name: Get latest upstream release
        id: upstream_release
        run: |
          LATEST_TAG=$(git tag --list --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $LATEST_TAG"

      - name: Check if already synced
        id: check_sync
        run: |
          LATEST_TAG=${{ steps.upstream_release.outputs.latest_tag }}
          FORCE=${{ github.event.inputs.force || 'false' }}

          if [ "$FORCE" = "true" ]; then
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "Force rebuild requested"
          elif git rev-parse "refs/tags/$LATEST_TAG-custom" >/dev/null 2>&1; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
            echo "Already synced to $LATEST_TAG"
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "Need to sync to $LATEST_TAG"
          fi

      - name: Setup Node.js
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: pnpm/action-setup@v4

      - name: Merge upstream release with custom changes
        if: steps.check_sync.outputs.already_synced == 'false'
        id: merge
        run: |
          set -uo pipefail
          LATEST_TAG='${{ steps.upstream_release.outputs.latest_tag }}'

          git checkout develop

          if ! git merge "$LATEST_TAG" -m "Merge upstream $LATEST_TAG with custom changes" --no-edit; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"

            # pnpm-lock.yaml is generated, not authored: take upstream's and
            # regenerate against the merged package.json. Any other conflict
            # needs a human, because auto-picking a side silently drops one.
            if [ "$CONFLICTS" = "pnpm-lock.yaml" ]; then
              git checkout --theirs pnpm-lock.yaml
              pnpm install --lockfile-only --no-frozen-lockfile
              git add pnpm-lock.yaml
              git commit --no-edit
            else
              git merge --abort
              {
                echo "conflicts<<CONFLICT_EOF"
                echo "$CONFLICTS"
                echo "CONFLICT_EOF"
              } >> "$GITHUB_OUTPUT"
              echo "::error::Cannot merge $LATEST_TAG automatically - $(echo "$CONFLICTS" | wc -l | tr -d ' ') file(s) conflict and need manual resolution"
              echo "$CONFLICTS" | sed 's/^/  - /'
              exit 1
            fi
          fi

          # Tag this merged state
          git tag -d "$LATEST_TAG-custom" 2>/dev/null || true
          git push origin ":refs/tags/$LATEST_TAG-custom" 2>/dev/null || true
          git tag "$LATEST_TAG-custom"

          # Push both the tag and develop
          git push origin "$LATEST_TAG-custom"
          git push origin develop

      - name: Set up Docker Buildx
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: steps.check_sync.outputs.already_synced == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/seerr
          tags: |
            type=raw,value=${{ steps.upstream_release.outputs.latest_tag }}-custom
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ steps.upstream_release.outputs.latest_tag }}-custom
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.upstream_release.outputs.latest_tag }}-custom
          name: Seerr ${{ steps.upstream_release.outputs.latest_tag }} (Custom)
          body: |
            ## Custom Seerr Release

            Based on upstream [seerr-team/seerr@${{ steps.upstream_release.outputs.latest_tag }}](https://github.com/seerr-team/seerr/releases/tag/${{ steps.upstream_release.outputs.latest_tag }})

            ### Custom Features:
            - ✨ **MANAGE_MEDIA Permission**: Allows non-admin users to delete media from Radarr/Sonarr
            - ✨ **Multiple Discord Webhooks**: Support for up to 5 Discord webhook URLs for notifications

            ### Docker Image:
            ```bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/seerr:${{ steps.upstream_release.outputs.latest_tag }}-custom
            # or
            docker pull ${{ secrets.DOCKER_USERNAME }}/seerr:latest
            ```

            🤖 This release was automatically generated and built
          draft: false
          prerelease: false

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          LATEST_TAG: ${{ steps.upstream_release.outputs.latest_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ -n "$CONFLICTS" ]; then
            TITLE="Sync blocked: $LATEST_TAG needs a manual merge"
            BODY="Upstream \`$LATEST_TAG\` conflicts with your custom changes, so nothing was tagged, built, or released."
            BODY="$BODY"$'\n\n'"Conflicting files:"$'\n'"$(echo "$CONFLICTS" | sed 's/^/- /')"
            BODY="$BODY"$'\n\n'"Resolve locally, push develop, then re-run this workflow with \`force\` enabled."
          else
            TITLE="Sync failed: $LATEST_TAG"
            BODY="The sync-and-release run failed before publishing. Nothing was released."
          fi

          echo "$BODY"

          if [ -n "$DISCORD_WEBHOOK" ]; then
            jq -n --arg t "$TITLE" --arg b "$BODY" --arg u "$RUN_URL" \
              '{embeds:[{title:$t,description:($b+"\n\n[View run]("+$u+")"),color:15158332}]}' \
            | curl -sS -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK" || true
          fi

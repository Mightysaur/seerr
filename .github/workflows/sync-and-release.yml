name: Sync with Upstream and Release

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/seerr-team/seerr.git || true
          git fetch upstream --tags

      - name: Get latest upstream release
        id: upstream_release
        run: |
          LATEST_TAG=$(git tag --list --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $LATEST_TAG"

      - name: Check if already synced
        id: check_sync
        run: |
          LATEST_TAG=${{ steps.upstream_release.outputs.latest_tag }}
          if git rev-parse "refs/tags/$LATEST_TAG-custom" >/dev/null 2>&1; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
            echo "Already synced to $LATEST_TAG"
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "Need to sync to $LATEST_TAG"
          fi

      - name: Merge upstream release with custom changes
        if: steps.check_sync.outputs.already_synced == 'false'
        run: |
          LATEST_TAG=${{ steps.upstream_release.outputs.latest_tag }}

          # Create a new branch from the upstream tag
          git checkout -b sync-$LATEST_TAG $LATEST_TAG

          # Cherry-pick your custom commit (MANAGE_MEDIA permission)
          # Find the commit with our changes
          CUSTOM_COMMIT=$(git log --all --grep="Add MANAGE_MEDIA permission" --format="%H" | head -n 1)

          if [ -n "$CUSTOM_COMMIT" ]; then
            echo "Found custom commit: $CUSTOM_COMMIT"
            git cherry-pick $CUSTOM_COMMIT || {
              echo "Cherry-pick failed. Manual intervention needed."
              exit 1
            }
          else
            echo "Custom commit not found. Skipping."
          fi

          # Tag this new version
          git tag "$LATEST_TAG-custom"
          git push origin "$LATEST_TAG-custom"

          # Update develop branch
          git checkout develop
          git merge sync-$LATEST_TAG --ff-only || git merge sync-$LATEST_TAG -m "Merge upstream $LATEST_TAG with custom changes"
          git push origin develop

      - name: Set up Docker Buildx
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: steps.check_sync.outputs.already_synced == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/seerr
          tags: |
            type=raw,value=${{ steps.upstream_release.outputs.latest_tag }}-custom
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ steps.upstream_release.outputs.latest_tag }}-custom
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.check_sync.outputs.already_synced == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.upstream_release.outputs.latest_tag }}-custom
          name: Seerr ${{ steps.upstream_release.outputs.latest_tag }} (Custom)
          body: |
            ## Custom Seerr Release

            Based on upstream [seerr-team/seerr@${{ steps.upstream_release.outputs.latest_tag }}](https://github.com/seerr-team/seerr/releases/tag/${{ steps.upstream_release.outputs.latest_tag }})

            ### Custom Features:
            - ✨ **MANAGE_MEDIA Permission**: Allows non-admin users to delete media from Radarr/Sonarr
            - ✨ **Multiple Discord Webhooks**: Support for up to 5 Discord webhook URLs for notifications

            ### Docker Image:
            ```bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/seerr:${{ steps.upstream_release.outputs.latest_tag }}-custom
            # or
            docker pull ${{ secrets.DOCKER_USERNAME }}/seerr:latest
            ```

            🤖 This release was automatically generated and built
          draft: false
          prerelease: false
